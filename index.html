        </div>
      </div>
    </div>
    ${esGuiada() ? pistasHtml(no) : ''}`;
  };

  function retroHtml(no, cal) {
    const r = UI.retro[no];
    let h = '';
    if (r && r.avisos && r.avisos.length) {
      h += `<div class="aviso adv"><b>Advertencias</b> (no impiden guardar)<ul>${r.avisos.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>`;
    }
    if (esGuiada() && S.polizas[no] && S.polizas[no].guardada && cal) {
      const d = cal.detalle.find((x) => x.asiento === no);
      const cls = { correcto: 'ok', parcial: 'adv', revisar: 'err' }[d.estado];
      const titulo = { correcto: '✔ Asiento correcto', parcial: '◐ Asiento parcialmente correcto', revisar: '✘ Revise el asiento' }[d.estado];
      h += `<div class="aviso ${cls}"><b>${titulo}</b> · ${Math.round(d.pct * 100)} %

  function pistasHtml(no) {
    const nivel = S.pistas[no] || 0;

    let h = `<div class="panel no-print"><div class="cab"><h3>Pistas</h3><div class="acciones">

        ${p.nivel3.map((l) => `<tr><td class="cod">${Motor.mascara(l.c)}</td><td>${esc(l.d)}</td><td class="num">${l.cargo ? fmt(l.cargo) : ''}</td><td class="num">${l.abono ? fmt(l.abono) : ''}</td></tr>`).join('')}</tbody></table></div></div>`;

  function erroresPoliza(b) {

  /* Actualiza mensajes, totales y botón sin redibujar los campos (conserva el foco). */
  function actualizarCaptura() {
    if (!$('#filas')) return;
    const no = S.actual;
    const b = borrador(no);
    const errores = erroresPoliza(b);
    $$('#filas tr').forEach((tr) => {
      const i = Number(tr.dataset.i);

      $('.nombre', tr).textContent = f && f.c ? nombreCta(f.c) : '';
    });

    ['contable', 'presupuestal'].forEach((t) => {
      s[t] = Motor.sumas(Motor.renglonesValidos(b[t]));
      const m = $(`[data-marca="${t}"]`);
      if (m) m.textContent = s[t].dif === 0 ? '✔' : '✘';
    });
    const act = s[UI.tab];
    const otra = UI.tab === 'contable' ? 'presupuestal' : 'contable';
    $('#totales').innerHTML = `
      <div><span class="etq">Total cargos</span><b>${fmt(act.cargos)}</b></div>
      <div><span class="etq">Total abonos</span><b>${fmt(act.abonos)}</b></div>
      <div class="${act.dif === 0 ? 'dif-bien' : 'dif-mal'}"><span class="etq">Diferencia</span><b>${act.dif === 0 ? '✔ $0.00' : fmt(Math.abs(act.dif))}</b></div>
      <div class="${s[otra].dif === 0 ? 'dif-bien' : 'dif-mal'}"><span class="etq">Registro ${otra}</span><b>${s[otra].dif === 0 ? '✔ Cuadra' : 'Dif. ' + fmt(Math.abs(s[otra].dif))}</b></div>`;
    const hayLineas = Motor.renglonesValidos(b.contable).length + Motor.renglonesValidos(b.presupuestal).length > 0;
    const faltaClasif = Motor.renglonesValidos(b.presupuestal).length > 0 && !b.clasif;
    const ok = !bloqueado() && hayLineas && !errores.length && s.contable.dif === 0 && s.presupuestal.dif === 0 && !faltaClasif;
    const btn = $('#btn-guardar');
    btn.disabled = !ok;
    let motivo = '';
    if (!hayLineas) motivo = 'Capture al menos un renglón.';
    else if (errores.length) motivo = 'Corrija los renglones marcados en rojo.';
    else if (s.contable.dif !== 0 || s.presupuestal.dif !== 0) motivo = 'Cada pestaña debe cuadrar (cargos = abonos).';
    else if (faltaClasif) motivo = 'Seleccione la clasificación presupuestal en la pestaña Registro presupuestal.';
    btn.title = motivo;
    const ep = $('#estado-pol');
    if (ep && motivo && !bloqueado()) ep.textContent = motivo;
    else if (ep) ep.textContent = S.borradores[no] ? 'Listo para guardar' : (S.polizas[no] ? 'Póliza guardada' : 'Póliza nueva');
  }

  function prepararCaptura() {
    $('#filas').innerHTML = filasHtml();
    actualizarCaptura();
  }

  function guardarPoliza() {
    const no = S.actual;
    const b = borrador(no);
    const limpia = (rs) => Motor.renglonesValidos(rs).map((f) => ({ c: f.c, cargo: Number(f.cargo) || '', abono: Number(f.abono) || '' }));
    const p = { contable: limpia(b.contable), presupuestal: limpia(b.presupuestal), clasif: b.clasif || '', guardada: true, ts: new Date().toISOString() };
    if (!p.presupuestal.length) p.clasif = '';
    S.polizas[no] = p;
    delete S.borradores[no];
    persistir(true);
    // Advertencias de secuencia de momentos y sobregiros del capítulo/rubro afectado
    const avisos = Motor.advertenciasPoliza(p.presupuestal);
    if (p.clasif && p.clasif !== 'NA') {
      Motor.advertenciasMomentos(lineas(), PPTO)
        .filter((a) => a.startsWith(`Capítulo ${p.clasif}:`) || a.startsWith(`Rubro ${p.clasif}:`))
        .forEach((a) => avisos.push(a));
    }
    const bzAhora = Motor.balanza(lineas(), CAT);
    const tocadas = new Set([...p.contable, ...p.presupuestal].map((r) => r.c));
    Motor.saldosContrarios(bzAhora).filter((f) => tocadas.has(f.c)).forEach((f) => avisos.push(
      `La cuenta ${Motor.mascara(f.c)} ${f.d} es de naturaleza ${f.nat === 'D' ? 'deudora' : 'acreedora'} y quedó con saldo ${f.saldo > 0 ? 'deudor' : 'acreedor'} de ${fmtTxt(Math.abs(f.saldo))}. Revise si invirtió cargo y abono.`));
    const retro = { avisos };
    if (esGuiada()) {
      const todas = [...p.contable, ...p.presupuestal];
      retro.marcas = Calificador.compararAsiento(todas, SOL.filter((l) => l.a === no)).marcas;
      const d = calificar().detalle.find((x) => x.asiento === no);
      toast(`Póliza ${numPoliza(no)} guardada · ${ESTADO_TXT[d.estado]}`);
    } else {
      toast(`Póliza ${numPoliza(no)} guardada.`);
    }
    UI.retro[no] = retro;
    render();
  }

  /* ---------- autocompletado de cuentas ---------- */
  const SUG = document.createElement('div');
  SUG.className = 'sugerencias'; SUG.hidden = true; SUG.setAttribute('role', 'listbox');
  document.body.appendChild(SUG);
  let sugInput = null, sugItems = [], sugAct = 0, sugFiltro = null;

  function buscarCuentas(q, filtro) {
    const t = norm(q).trim();
    const dig = t.replace(/[-\s]/g, '');
    let r = CAT.filter((c) => !filtro || filtro(c.c));
    if (!t) r = r.filter((c) => c.det);
    else if (/^\d+$/.test(dig)) r = r.filter((c) => c.c.startsWith(dig));
    else {
      const ps = t.split(/\s+/);
      r = r.filter((c) => { const n = BUSCA.get(c.c); return ps.every((p) => n.includes(p)); });
    }
    return r.slice(0, 80);
  }
  function abrirSug(input, filtro) {
    sugInput = input; sugFiltro = filtro;
    const q = input.value;
    sugItems = buscarCuentas(/^\d[\d-]*$/.test(q) && q.length === 18 ? '' : q, filtro);
    sugAct = Math.max(0, sugItems.findIndex((c) => c.det));
    pintarSug();
  }
  function pintarSug() {
    if (!sugInput) return;
    SUG.innerHTML = sugItems.length
      ? sugItems.map((c, i) => `<div role="option" data-i="${i}" class="${c.det ? '' : 'mayor'} ${i === sugAct ? 'act' : ''}" aria-selected="${i === sugAct}">
          <span class="cod">${Motor.mascara(c.c)}</span><span>${esc(c.d)}</span>${c.det ? '' : '<span class="tag">Mayor</span>'}</div>`).join('')
      : '<span class="vacio" style="padding:8px 10px">Ninguna cuenta coincide. Escriba parte del código o del nombre.</span>';
    const r = sugInput.getBoundingClientRect();
    SUG.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - SUG.offsetWidth - 8)) + 'px';
    SUG.style.top = (r.bottom + window.scrollY + 2) + 'px';
    SUG.hidden = false;
    const a = SUG.querySelector('.act');
    if (a) a.scrollIntoView({ block: 'nearest' });
  }
  function cerrarSug() { SUG.hidden = true; sugInput = null; }
  SUG.addEventListener('mousedown', (e) => e.preventDefault());
  SUG.addEventListener('click', (e) => {
    const d = e.target.closest('[data-i]');
    if (d && sugInput) elegirCuenta(sugInput, sugItems[Number(d.dataset.i)]);
  });

  function elegirCuenta(input, cta) {
    if (input.id === 'mayor-cta') {
      UI.mayor = cta.c; cerrarSug(); render(); return;
    }
    const i = Number(input.dataset.i);
    const b = editar(S.actual);
    b[UI.tab][i].c = cta.c;
    delete b[UI.tab][i].txt;
    input.value = Motor.mascara(cta.c);
    cerrarSug();
    persistir();
    actualizarCaptura();
    if (cta.det) {
      const sig = $(`input[data-k="cargo"][data-i="${i}"]`);
      if (sig) sig.focus();
    }
  }
  /* Interpreta lo que se escribió en Cuenta: código completo o nombre con una sola coincidencia. */
  function resolverTexto(v, actual) {
    v = (v || '').trim();
    const dig = v.replace(/[-\s]/g, '');
    if (!v) return { c: '' };
    if (/^\d{12}$/.test(dig)) return { c: dig };
    if (actual.c && v === Motor.mascara(actual.c)) return { c: actual.c };
    const r = buscarCuentas(v, filtroTab()).filter((x) => x.det);
    return r.length === 1 ? { c: r[0].c } : { c: '', txt: v };
  }
  function resolverCuentaEscrita(input) {
    const i = Number(input.dataset.i);
    const actual = borrador(S.actual)[UI.tab][i];
    if (!actual) return;
    const vivo = input.isConnected;
    const { c, txt } = resolverTexto(vivo ? input.value : (actual.txt || (actual.c && Motor.mascara(actual.c))), actual);
    if (vivo && c) input.value = Motor.mascara(c);
    if (c !== actual.c || txt !== actual.txt) {
      const f = editar(S.actual)[UI.tab][i];
      f.c = c;
      if (txt) f.txt = txt; else delete f.txt;
      persistir();
    }
    if (!vivo) { // la tabla se redibujó: actualizar la celda nueva sin mover el foco
      const nuevo = $(`#filas input.cta[data-i="${i}"]`);
      if (nuevo && nuevo !== document.activeElement) nuevo.value = c ? Motor.mascara(c) : (txt || '');
    }
    actualizarCaptura();
  }
  const filtroTab = () => (UI.tab === 'presupuestal' ? (c) => c[0] === '8' : (c) => c[0] !== '8');

  /* ---------------- Libro Diario ---------------- */
  VISTAS.diario = () => {
    const ls = lineas();
    const f = UI.dFiltro;
    const q = norm(f.c).replace(/-/g, '');
    const vis = ls.filter((l) => (!f.a || l.a === f.a) && (!f.t || l.t === f.t)
      && (!q || l.c.startsWith(q) || norm(nombreCta(l.c)).includes(q)));
    const tc = vis.reduce((s, l) => s + l.cargo, 0), ta = vis.reduce((s, l) => s + l.abono, 0);
    let prev = null;
    return `
    <div class="encab"><div><div class="ruta">Inicio › Libro Diario</div><h2>Libro Diario</h2></div></div>
    <div class="panel"><div class="cuerpo">
      <div class="filtros">
        <div class="campo"><label for="fd-a">Asiento</label><select id="fd-a" data-filtro="a"><option value="">Todos</option>${OPS.map((o) => `<option ${f.a === o.no ? 'selected' : ''}>${o.no}</option>`).join('')}</select></div>
        <div class="campo"><label for="fd-t">Tipo</label><select id="fd-t" data-filtro="t"><option value="">Todos</option>${['Apertura', 'Contable', 'Presupuestal'].map((t) => `<option ${f.t === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="campo" style="flex:1 1 220px"><label for="fd-c">Cuenta (código o nombre)</label><input id="fd-c" data-filtro="c" value="${esc(f.c)}" placeholder="Ej. 8250 o bancos"></div>
      </div>
      <div class="tabla-cont"><table class="t"><thead><tr><th>Póliza</th><th>Tipo</th><th>Código</th><th>Cuenta</th><th>Clasif.</th><th class="num">Cargo</th><th class="num">Abono</th></tr></thead>
        <tbody>${vis.map((l) => { const nuevo = l.a !== prev; prev = l.a; return `<tr ${nuevo ? 'style="border-top:2px solid var(--linea-fuerte)"' : ''}>
          <td>${nuevo ? `<a href="#captura" data-acc="abrir" data-no="${l.a}" class="cod">${numPoliza(l.a)}</a>` : ''}</td><td>${l.t}</td><td class="cod">${Motor.mascara(l.c)}</td><td>${esc(nombreCta(l.c))}</td><td class="cod">${esc(l.clasif)}</td>
          <td class="num">${l.cargo ? fmt(l.cargo) : ''}</td><td class="num">${l.abono ? fmt(l.abono) : ''}</td></tr>`; }).join('')
          || '<tr><td colspan="7" class="tenue">Aún no hay pólizas guardadas que coincidan con el filtro.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="5">Sumas (${vis.length} renglones) ${Motor.igual(tc, ta) ? '· ✔ Cuadra' : '· ✘ No cuadra'}</td><td class="num">${fmt(tc)}</td><td class="num">${fmt(ta)}</td></tr></tfoot></table></div>
    </div></div>`;
  };

  /* ---------------- Mayor / Cuentas T ---------------- */
  VISTAS.mayor = () => {
    const ls = lineas();
    const cta = IDX.get(UI.mayor) || IDX.get('111210010001');
    const mov = ls.filter((l) => l.c.startsWith(cta.pre));
    const si = r2(mov.filter((l) => l.t === 'Apertura').reduce((s, l) => s + l.cargo - l.abono, 0));
    const cargos = mov.filter((l) => l.t !== 'Apertura' && l.cargo);
    const abonos = mov.filter((l) => l.t !== 'Apertura' && l.abono);
    const sd = r2((si > 0 ? si : 0) + cargos.reduce((s, l) => s + l.cargo, 0));
    const sa = r2((si < 0 ? -si : 0) + abonos.reduce((s, l) => s + l.abono, 0));
    const saldo = r2(sd - sa);
    const conMov = [...new Set(ls.map((l) => l.c))].sort();
    const fila = (ref, v) => `<div class="mov"><span class="ref">${ref}</span><span>${fmt(v)}</span></div>`;
    return `
    <div class="encab"><div><div class="ruta">Inicio › Mayor</div><h2>Mayor / Cuentas T</h2></div></div>
    <div class="panel"><div class="cuerpo">
      <div class="campo" style="max-width:560px"><label for="mayor-cta">Cuenta (detalle o mayor)</label>
        <input id="mayor-cta" value="${Motor.mascara(cta.c)}" autocomplete="off" spellcheck="false" placeholder="Código o nombre"></div>
      <div class="cuenta-t" aria-label="Cuenta T">
        <div class="tit"><span class="cod">${Motor.mascara(cta.c)}</span><br>${esc(cta.d)} <span class="tenue">· naturaleza ${cta.nat === 'D' ? 'deudora' : 'acreedora'}${cta.det ? '' : ' · cuenta de mayor'}</span></div>
        <div class="cols">
          <div class="col"><span class="etq">Debe (cargos)</span>${si > 0 ? fila('S.I.', si) : ''}${cargos.map((l) => fila(numPoliza(l.a), l.cargo)).join('')}<div class="mov sum"><span>Suma</span><span>${fmt(sd)}</span></div></div>
          <div class="col"><span class="etq">Haber (abonos)</span>${si < 0 ? fila('S.I.', -si) : ''}${abonos.map((l) => fila(numPoliza(l.a), l.abono)).join('')}<div class="mov sum"><span>Suma</span><span>${fmt(sa)}</span></div></div>
        </div>
        <div class="saldo">Saldo final: ${fmt(Math.abs(saldo))} ${saldo > 0 ? 'deudor' : saldo < 0 ? 'acreedor' : ''}</div>
      </div>
    </div></div>
    <div class="panel"><div class="cab"><h3>Cuentas con movimiento</h3></div><div class="cuerpo"><div class="acciones">
      ${conMov.map((c) => `<button class="btn chico ${c === cta.c ? 'prim' : ''}" data-acc="ver-mayor" data-v="${c}" title="${esc(nombreCta(c))}">${Motor.mascara(c)}</button>`).join('') || '<span class="tenue">Guarde pólizas para ver aquí sus cuentas.</span>'}
    </div></div></div>`;
  };

  /* ---------------- Balanza ---------------- */
  VISTAS.balanza = () => {
    const bz = Motor.balanza(lineas(), CAT);
    const filas = bz.filas.filter((f) => f.niv <= UI.bzNivel && (!UI.bzMov || f.si || f.cargos || f.abonos));
    const contrarias = Motor.saldosContrarios(bz);
    const esContraria = new Set(contrarias.map((f) => f.c));
    const d = (v) => fmt(Math.max(v, 0), '–');
    const a = (v) => fmt(Math.max(-v, 0), '–');
    const sumas = (pred) => {
      const fs = bz.filas.filter((f) => f.det && pred(f.c[0]));
      const t = (fn) => fs.reduce((x, f) => x + fn(f), 0);
      return [t((f) => Math.max(f.si, 0)), t((f) => Math.max(-f.si, 0)), t((f) => f.cargos), t((f) => f.abonos), t((f) => Math.max(f.saldo, 0)), t((f) => Math.max(-f.saldo, 0))];
    };
    const pie = (n, v) => `<tr><td colspan="3">${n}</td>${v.map((x) => `<td class="num">${fmt(x)}</td>`).join('')}</tr>`;
    const resumen = (n, x) => `<div class="aviso ${Motor.igual(x.deudor, x.acreedor) ? 'ok' : 'err'}"><b>${n}</b>: saldos deudores ${fmtTxt(x.deudor)} · saldos acreedores ${fmtTxt(x.acreedor)} ${Motor.igual(x.deudor, x.acreedor) ? '· ✔ sumas iguales' : '· ✘ diferencia ' + fmtTxt(Math.abs(x.deudor - x.acreedor))}</div>`;
    return `
    <div class="encab"><div><div class="ruta">Inicio › Balanza</div><h2>Balanza de comprobación</h2></div>
      <div>${bz.cuadra ? '<span class="estado e-correcto">✔ Balanza cuadrada</span>' : '<span class="estado e-revisar">✘ Balanza descuadrada</span>'}</div></div>
    ${resumen('Cuentas contables (1 a 7)', bz.contable)}${resumen('Cuentas presupuestales (8)', bz.presupuestal)}
    ${contrarias.length ? `<div class="aviso err"><b>⚠ ${contrarias.length} cuenta(s) con saldo contrario a su naturaleza.</b> Revise cargos y abonos de sus pólizas.<ul>${contrarias.map((f) => `<li><span class="cod">${Motor.mascara(f.c)}</span> ${esc(f.d)}: naturaleza ${f.nat === 'D' ? 'deudora' : 'acreedora'}, saldo ${f.saldo > 0 ? 'deudor' : 'acreedor'} de ${fmtTxt(Math.abs(f.saldo))}</li>`).join('')}</ul></div>`
      : (lineas().length ? '<div class="aviso ok">✔ Todas las cuentas de detalle tienen saldo acorde con su naturaleza.</div>' : '')}
    <div class="panel"><div class="cuerpo">
      <div class="filtros">
        <div class="campo"><label for="bz-niv">Mostrar hasta el nivel</label><select id="bz-niv">${[1, 2, 3, 4, 5, 6, 7].map((n) => `<option value="${n}" ${UI.bzNivel === n ? 'selected' : ''}>Nivel ${n}${n === 7 ? ' (todas)' : ''}</option>`).join('')}</select></div>
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bz-mov" ${UI.bzMov ? 'checked' : ''}> Solo cuentas con saldo o movimiento</label>
      </div>
      <p class="tenue" style="font-size:var(--t-s)">Nat.: D = deudora (aumenta con cargos), A = acreedora (aumenta con abonos). Las cuentas de mayor suman a sus subcuentas.</p>
      <div class="tabla-cont"><table class="t">
      <thead><tr><th rowspan="2">Código contable</th><th rowspan="2">Cuenta</th><th rowspan="2">Nat.</th><th colspan="2" style="text-align:center">Saldo inicial</th><th colspan="2" style="text-align:center">Movimientos</th><th colspan="2" style="text-align:center">Saldo final</th></tr>
        <tr><th class="num">Deudor</th><th class="num">Acreedor</th><th class="num">Cargos</th><th class="num">Abonos</th><th class="num">Deudor</th><th class="num">Acreedor</th></tr></thead>
      <tbody>${filas.map((f) => `<tr class="${f.det ? '' : 'mayor'} ${f.niv === 1 ? 'niv1' : ''} ${esContraria.has(f.c) ? 'alerta' : ''} clic" data-acc="ver-mayor" data-v="${f.c}" title="${esContraria.has(f.c) ? 'Saldo contrario a su naturaleza · ' : ''}Ver cuenta T">
        <td class="cod">${Motor.mascara(f.c)}</td><td style="padding-left:${(f.niv - 1) * 10 + 9}px">${esContraria.has(f.c) ? '⚠ ' : ''}${esc(f.d)}</td><td class="cod">${f.nat}</td>
        <td class="num">${d(f.si)}</td><td class="num">${a(f.si)}</td><td class="num">${fmt(f.cargos, '–')}</td><td class="num">${fmt(f.abonos, '–')}</td><td class="num">${d(f.saldo)}</td><td class="num">${a(f.saldo)}</td></tr>`).join('')
        || '<tr><td colspan="9" class="tenue">Sin movimientos. Guarde la póliza de apertura para empezar.</td></tr>'}</tbody>
      <tfoot>${pie('Sumas cuentas contables (1 a 7)', sumas((g) => g !== '8'))}${pie('Sumas cuentas presupuestales (8)', sumas((g) => g === '8'))}</tfoot>
      </table></div>
    </div></div>`;
  };

  /* ---------------- Control presupuestal ---------------- */
  VISTAS.presupuesto = () => {
    const cp = Motor.presupuesto(lineas(), PPTO);
    const pct = (a, b) => (b ? (a / b * 100).toFixed(1) + ' %' : '–');
    const ti = cp.totIngresos, te = cp.totEgresos;
    return `
    <div class="encab"><div><div class="ruta">Inicio › Control presupuestal</div><h2>Control presupuestal</h2></div></div>
    <div class="aviso ${Motor.igual(cp.registrado.estimado, ti.estimado) && Motor.igual(cp.registrado.aprobado, te.aprobado) ? 'ok' : 'info'}">
      Registrado en cuentas de orden: Ley de Ingresos estimada (811) ${fmtTxt(cp.registrado.estimado)} de ${fmtTxt(ti.estimado)} ·
      Presupuesto de Egresos aprobado (821) ${fmtTxt(cp.registrado.aprobado)} de ${fmtTxt(te.aprobado)}.</div>
    <div class="panel"><div class="cab"><h3>Estado analítico de ingresos por rubro (CRI)</h3></div><div class="cuerpo"><div class="tabla-cont">
      <table class="t"><thead><tr><th>Rubro</th><th>Concepto</th><th class="num">Estimado</th><th class="num">Modificaciones</th><th class="num">Modificado</th><th class="num">Devengado</th><th class="num">Recaudado</th><th class="num">Por recaudar</th><th class="num">% Rec.</th></tr></thead>
      <tbody>${cp.ingresos.map((i) => `<tr class="${i.alerta ? 'alerta' : ''}" ${i.alerta ? `title="${esc(i.alerta)}"` : ''}><td class="cod">${i.clave}</td><td>${esc(i.concepto)}${i.alerta ? `<br><b class="neg">⚠ ${esc(i.alerta)}</b>` : ''}</td>
        <td class="num">${fmt(i.estimado, '–')}</td><td class="num">${fmt(i.modificaciones, '–')}</td><td class="num">${fmt(i.modificado, '–')}</td><td class="num">${fmt(i.devengado, '–')}</td><td class="num">${fmt(i.recaudado, '–')}</td><td class="num">${fmt(i.porRecaudar, '–')}</td><td class="num">${pct(i.recaudado, i.modificado)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="num">${fmt(ti.estimado)}</td><td class="num">${fmt(ti.modificaciones)}</td><td class="num">${fmt(ti.modificado)}</td><td class="num">${fmt(ti.devengado)}</td><td class="num">${fmt(ti.recaudado)}</td><td class="num">${fmt(ti.porRecaudar)}</td><td class="num">${pct(ti.recaudado, ti.modificado)}</td></tr></tfoot></table></div></div></div>
    <div class="panel"><div class="cab"><h3>Estado del ejercicio del presupuesto de egresos por capítulo (COG)</h3></div><div class="cuerpo"><div class="tabla-cont">

          if (e.app !== 'SCG-Edu' || !e.polizas) throw new Error('formato');
          const v = datosCaso(e.caso || '');
          const ops = v.operaciones.operaciones;
          const cal = Calificador.calificar(e.polizas, v.solucion, ops, e.vistas || {}, Object.fromEntries(ops.map((o) => [o.no, o.clasif])));
          const h = huella(JSON.stringify(e.caso !== undefined ? [e.alumno, e.polizas, e.vistas, e.calificacion, e.caso] : [e.alumno, e.polizas, e.vistas, e.calificacion]));
          let ok = true, nota = '';
          if (e.huella && h !== e.huella) { ok = false; nota = 'El archivo fue modificado'; }
          else if (!e.huella) { ok = false; nota = 'Archivo de avance, no de entrega'; }

      const n = Number(el.dataset.v);
      if (n === 3) { UI.confirmar = 'sol-' + S.actual; render(); return; }
      S.pistas[S.actual] = Math.max(S.pistas[S.actual] || 0, n); persistir(); render();
    },
    'ver-solucion': () => { S.pistas[S.actual] = 3; S.vistas[S.actual] = true; UI.confirmar = null; persistir(true); render(); },
    'cancelar': () => { UI.confirmar = null; render(); },
    'ver-mayor': (el) => { UI.mayor = el.dataset.v; ir('mayor'); },
    'entregar': () => { UI.confirmar = 'entregar'; render(); },
    'entregar-ok': () => { S.entregado = new Date().toISOString(); UI.confirmar = null; persistir(true); render(); toast('Evaluación entregada. Descargue el reporte y envíelo a su profesor.'); },
    'reiniciar': () => { UI.confirmar = 'reiniciar'; render(); },
    'reiniciar-ok': () => { S = nuevoEstado(); usarCaso(''); UI.confirmar = null; UI.retro = {}; persistir(true); ir('inicio'); },
    'dis-generar': () => { const c = $('#dis-codigo').value; UI.dis = { codigo: Casos.esBase(c) ? '' : Casos.normal(c), f: Casos.factores(c, BASE) }; render(); },
    'dis-base': () => { UI.dis = { codigo: '', f: Casos.factores('', BASE) }; render(); },
    'copiar-clave': () => {
      const t = $('#clave-caso').textContent;
      const ok = () => toast('Clave copiada.');
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => toast('Seleccione la clave y cópiela con Ctrl+C.')); else toast('Seleccione la clave y cópiela con Ctrl+C.');
    },
    'dis-solucion': () => {
      UI.dis.clave = $('#dis-clave').value;
      if (huella(UI.dis.clave) !== HUELLA_PROFESOR) { toast('Clave del profesor incorrecta.'); return; }
      guardarArchivo(`Solucion_caso_${(UI.dis.codigo || 'BASE').replace(/[^\w-]/g, '_')}.html`, solucionCasoHtml(UI.dis.codigo, UI.dis.f), 'text/html');
    },
    'descargar-entrega': () => guardarArchivo(nombreArchivo('json'), JSON.stringify(datosEntrega(), null, 1)),
    'descargar-html': () => guardarArchivo(nombreArchivo('html'), reporteHtml(), 'text/html'),
    'imprimir': () => window.print(),
    'ef': (el) => { UI.ef = el.dataset.v; render(); },
    'ldf': (el) => { UI.ldf = el.dataset.v; render(); },
    'descargar-ldf': () => guardarArchivo(nombreArchivo('html').replace('.html', '_formatos_LDF.html'), htmlLDF(), 'text/html'),
    'descargar-ef': () => guardarArchivo(nombreArchivo('html').replace('.html', '_estados_CONAC.html'), htmlEstados(), 'text/html'),
    'exportar': () => guardarArchivo(`SCG-Edu_avance_${(S.alumno.matricula || 'alumno').replace(/[^\w-]/g, '')}.json`, JSON.stringify(S, null, 1)),
    'csv': () => {
      const cab = ['Alumno', 'Matrícula', 'Grupo', 'Modo', 'Entrega', 'Calificación', 'Correctas/Parciales/Revisar/Pendientes', 'Soluciones vistas', 'Integridad'];
      const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const txt = [cab].concat(UI.profesor.map((f) => [f.nombre, f.matricula, f.grupo, f.modo, f.fecha, f.calif.toFixed(1), f.res, f.vistas, f.ok ? 'Íntegro' : f.nota]))
        .map((r) => r.map(q).join(',')).join('\r\n');
      guardarArchivo('SCG-Edu_concentrado.csv', '﻿' + txt, 'text/csv');
    },
    'limpiar-prof': () => { UI.profesor = []; render(); },
    'cerrar-texto': () => { UI.textoManual = null; render(); },
    'copiar-texto': () => {
      const ta = $('#texto-manual');
      const ok = () => toast('Contenido copiado.');
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(ok, () => { ta.select(); toast('Seleccionado: presione Ctrl+C.'); });
      else { ta.select(); toast('Seleccionado: presione Ctrl+C.'); }
    },
    'glosario': () => abrirGlosario(),
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-acc]');
    if (!el || el.disabled) return;
    const f = ACC[el.dataset.acc];
    if (f) { e.preventDefault(); f(el); }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'form-inicio') return;
    e.preventDefault();
    const nombre = $('#i-nombre').value.trim(), matricula = $('#i-matricula').value.trim();
    if (!nombre || !matricula) { toast('Capture su nombre y matrícula.'); return; }
    S.alumno = { nombre, matricula, grupo: $('#i-grupo').value.trim() };
    S.caso = Casos.esBase($('#i-caso').value) ? '' : Casos.normal($('#i-caso').value);
    usarCaso(S.caso);
    S.modo = $('input[name="modo"]:checked').value;
    persistir(true);
    ir('tablero');
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'f-importar' && t.files[0]) {
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const s = JSON.parse(rd.result);
          if (s.app !== 'SCG-Edu' || !s.polizas || !s.alumno) throw new Error('formato');
          S = Object.assign(nuevoEstado(), s, { tipo: 'avance' });
          usarCaso(S.caso);
          if (!S.modo) S.modo = 'guiada';
          UI.retro = {};
          persistir(true);
          toast(`Avance importado: ${Object.keys(S.polizas).length} pólizas.`);
          ir('tablero');
        } catch (err) { toast('El archivo no es un avance válido de SCG-Edu.'); }
      };
      rd.readAsText(t.files[0]);
    } else if (t.id === 'f-entregas') {
      cargarEntregas(t.files); t.value = '';
    } else if (t.id === 'sel-op') {
      S.actual = t.value; UI.tab = 'contable'; UI.confirmar = null; persistir(); render();
    } else if (t.id === 'sel-clasif') {
      editar(S.actual).clasif = t.value; persistir(); actualizarCaptura();
    } else if (t.dataset.filtro && t.tagName === 'SELECT') {
      UI.dFiltro[t.dataset.filtro] = t.value; render();
    } else if (t.classList && t.classList.contains('factor')) {
      const v = Math.max(50, Math.min(300, Math.round(Number(t.value) || 100)));
      UI.dis.f = Object.assign({}, UI.dis.f, { [t.dataset.k]: v / 100 });
      UI.dis.codigo = Casos.codigoManual(UI.dis.f);
      UI.dis.clave = $('#dis-clave') ? $('#dis-clave').value : '';
      render();
    } else if (t.id === 'bz-niv') {
      UI.bzNivel = Number(t.value); render();
    } else if (t.id === 'bz-mov') {
      UI.bzMov = t.checked; render();
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'fd-c') {
      UI.dFiltro.c = t.value;
      clearTimeout(t._tm);
      t._tm = setTimeout(() => { render(); const n = $('#fd-c'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300);
      return;
    }
    if (t.id === 'mayor-cta') { abrirSug(t, null); return; }
    if (!t.dataset.k || !$('#filas')) return;
    const i = Number(t.dataset.i);
    const b = editar(S.actual);
    const f = b[UI.tab][i];
    if (t.dataset.k === 'c') {
      const dig = t.value.replace(/[-\s]/g, '');
      if (/^\d{12}$/.test(dig)) { f.c = dig; delete f.txt; } else { f.c = ''; f.txt = t.value; }
      abrirSug(t, filtroTab());
    } else {
      const v = parseImp(t.value);
      f[t.dataset.k] = Number.isNaN(v) ? '' : v;
    }
    persistir();
    actualizarCaptura();
    const m = $(`#filas tr[data-i="${i}"] .msg`);
    if (m && t.dataset.k !== 'c' && Number.isNaN(parseImp(t.value))) m.textContent = 'Importe no válido: use solo números, por ejemplo 1,250,000.00';
  });

  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t.matches && t.matches('#filas input.cta') && !t.readOnly) abrirSug(t, filtroTab());
    else if (t.id === 'mayor-cta') { t.select(); abrirSug(t, null); }
    else if (sugInput && t !== sugInput) cerrarSug();
  });
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if (t.matches && t.matches('#filas input.cta') && !t.readOnly) {
      setTimeout(() => { if (document.activeElement !== t) { if (sugInput === t) cerrarSug(); resolverCuentaEscrita(t); } }, 120);
    } else if (t.matches && t.matches('#filas input.imp')) {
      const v = parseImp(t.value);
      if (!Number.isNaN(v)) t.value = fmtImp(v);
    } else if (t.id === 'mayor-cta') {
      setTimeout(() => { if (sugInput === t && document.activeElement !== t) cerrarSug(); }, 120);
    }
  });

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Escape') {
      if (!SUG.hidden) { cerrarSug(); return; }
      if (!$('#glosario').hidden) { cerrarGlosario(); return; }
    }
    if (sugInput === t && !SUG.hidden) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sugAct = Math.max(0, Math.min(sugItems.length - 1, sugAct + (e.key === 'ArrowDown' ? 1 : -1)));
        pintarSug(); return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (sugItems[sugAct]) elegirCuenta(t, sugItems[sugAct]);
        return;
      }
    }
    if (e.key === 'Enter' && t.matches && t.matches('#filas input.imp')) {
      e.preventDefault();
      const i = Number(t.dataset.i);
      const v = parseImp(t.value);
      if (!Number.isNaN(v)) t.value = fmtImp(v);
      const b = editar(S.actual);
      if (i === b[UI.tab].length - 1) {
        b[UI.tab].push(vacio()); persistir(); prepararCaptura();
      }
      const sig = $(`#filas input.cta[data-i="${i + 1}"]`);
      if (sig) sig.focus();
    }
  });

  /* ---------------- Glosario ---------------- */
  function abrirGlosario() { $('#glosario').hidden = false; $('#glosario').focus(); }
  function cerrarGlosario() { $('#glosario').hidden = true; $('#btn-glosario').focus(); }
  function glosarioHtml() {
    const egr = [
      ['821', 'Aprobado', 'Asignaciones anuales autorizadas en el Presupuesto de Egresos.'],
      ['822.1', 'Por ejercer', 'Presupuesto aprobado disponible, aún sin afectar.'],
      ['822.2', 'Precomprometido', 'Reserva por una requisición o solicitud autorizada, antes de formalizar con el tercero.'],
      ['824', 'Comprometido', 'Acto administrativo o instrumento jurídico que formaliza la relación con terceros (contrato, pedido, nómina).'],
      ['825', 'Devengado', 'Obligación de pago por la recepción de conformidad de bienes, servicios u obra.'],
      ['826', 'Ejercido', 'Emisión de la cuenta por liquidar certificada u orden de pago aprobada.'],
      ['827', 'Pagado', 'Cancelación total o parcial de la obligación mediante el desembolso.'],
    ];
    const ing = [
      ['811', 'Estimada', 'Importes anuales aprobados en la Ley de Ingresos.'],
      ['812', 'Por ejecutar', 'Ley de Ingresos estimada pendiente de devengar.'],
      ['813', 'Modificaciones', 'Incrementos o disminuciones a la Ley de Ingresos estimada.'],
      ['814', 'Devengada', 'Nace jurídicamente el derecho de cobro.'],
      ['815', 'Recaudada', 'Cobro en efectivo o por cualquier otro medio.'],
    ];
    const tabla = (ls) => `<table>${ls.map(([c, n, d]) => `<tr><td class="cod"><b>${c}</b></td><td><b>${n}</b><br><span class="tenue">${d}</span></td></tr>`).join('')}</table>`;
    return `
      <div class="encab"><h2 style="font-size:var(--t-l)">Glosario</h2><button class="btn chico" id="cerrar-glosario">Cerrar ✕</button></div>
      <h3>Momentos contables del egreso</h3>
      <div class="flujo"><span>821</span><i>→</i><span>822.1</span><i>→</i><span>822.2</span><i>→</i><span>824</span><i>→</i><span>825</span><i>→</i><span>826</span><i>→</i><span>827</span></div>
      <p class="tenue" style="font-size:var(--t-s)">Cada momento se registra con cargo a la cuenta del momento nuevo y abono a la del momento anterior.</p>
      ${tabla(egr)}
      <h3>Momentos contables del ingreso</h3>
      <div class="flujo"><span>811</span><i>→</i><span>812</span><i>→</i><span>814</span><i>→</i><span>815</span></div>
      ${tabla(ing)}
      <h3>Naturaleza de las cuentas</h3>
      <table>
        <tr><td class="cod"><b>1</b></td><td>Activo · deudora (aumenta con cargos)</td></tr>
        <tr><td class="cod"><b>2</b></td><td>Pasivo · acreedora (aumenta con abonos)</td></tr>
        <tr><td class="cod"><b>3</b></td><td>Hacienda pública / patrimonio · acreedora</td></tr>
        <tr><td class="cod"><b>4</b></td><td>Ingresos y otros beneficios · acreedora</td></tr>
        <tr><td class="cod"><b>5</b></td><td>Gastos y otras pérdidas · deudora</td></tr>
        <tr><td class="cod"><b>8</b></td><td>Cuentas de orden presupuestarias · se registran en la pestaña Registro presupuestal</td></tr>
      </table>
      <h3>Clasificador por Rubros de Ingresos (CRI)</h3>
      <table>${PPTO.ingresos.map((i) => `<tr><td class="cod"><b>${i.rubro}</b></td><td>${esc(i.concepto)}</td></tr>`).join('')}</table>
      <h3>Clasificador por Objeto del Gasto (COG)</h3>
      <table>${PPTO.egresos.map((e) => `<tr><td class="cod"><b>${e.capitulo}</b></td><td>${esc(e.concepto)}</td></tr>`).join('')}</table>
      <h3>Máscara del código contable</h3>
      <p style="font-size:var(--t-s)"><span class="cod">0-0-0-0-0-000-0000</span>: género, grupo, rubro, cuenta, subcuenta, auxiliar y subauxiliar.
      Solo se capturan cuentas de último nivel (detalle).</p>
      <h3>Tipos de póliza</h3>
      <table><tr><td><b>Ingreso</b></td><td>Entrada de dinero a bancos.</td></tr><tr><td><b>Egreso</b></td><td>Salida de dinero de bancos.</td></tr><tr><td><b>Diario</b></td><td>Operaciones sin movimiento de bancos.</td></tr></table>
      <h3>Base normativa</h3>
      <p class="tenue" style="font-size:var(--t-s)">Ley General de Contabilidad Gubernamental (LGCG), Plan de Cuentas, CRI, COG y Normas y Metodología para la Determinación de los Momentos Contables de los Egresos y de los Ingresos emitidos por el CONAC.</p>`;
  }

  /* ---------------- arranque ---------------- */
  $('#glosario').innerHTML = glosarioHtml();
  $('#btn-glosario').addEventListener('click', abrirGlosario);
  $('#glosario').addEventListener('click', (e) => { if (e.target.id === 'cerrar-glosario') cerrarGlosario(); });
  window.addEventListener('resize', () => { if (sugInput) pintarSug(); });
  window.addEventListener('scroll', () => { if (sugInput) pintarSug(); }, { passive: true });
  render();
})();

</script>

</body>
</html>
